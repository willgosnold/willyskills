layout = "folder"
# The rules an agent follows to write or repair a block entry.
guide = ".patchbook/patch.md"

[[upstream]]
name = "pstack"
remote = "https://github.com/cursor/plugins.git"
path = "pstack"
branch = "main"
mount = ""

# Only skills/ ships. Upstream's docs/, automations/, README.md and plugin.json are for Cursor users.
[output]
from = "skills"
to = "skills"

# {{model:<role>}}: filled by hooks.ts from models.json.
[placeholders.model]

# {{snippet:<name>}}: the text under `## <name>`.
[placeholders.snippet]
file = ".patchbook/snippets.md"
format = "sections"

# A shipped Markdown block that says one of these needs a block entry.
[[check]]
name = "cursor-terms"
files = ["**/*.md"]
pattern = '''\bCursor\b|\.cursor\b|cursor-(?:team-kit|grok)|\bTask\b|subagent_type|\breadonly\b|run_in_background|is_background|cloud_base_branch|environment: ?"|AskQuestion|\.mdc\b|\b[Gg]rok\b|\bcomposer-|\bComposer\b|claude-opus-\d+-\d+-|agent-transcripts|/loop\b|[Cc]loud agent|control-(?:ui|cli)|mcps/|[Tt]odo ?list|generalPurpose|\bcreate-skill\b|fast or standard|\bVMs?\b|allow_multiple|workspace-scoped|docs/guide/|\.\./README\.md'''

[test]
instructions = ".patchbook/testing.md"

[deploy]
command = "tools/update-projects.sh"
